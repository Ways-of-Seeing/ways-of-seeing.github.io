    </linearGradient>
    <linearGradient id="bRight" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#B9C4D4"/>
    </linearGradient>
    <pattern id="bGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1B2331" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bBg)"/>
