    <text x="3" y="278" font-size="19" font-weight="600" letter-spacing="5" fill="#8FA0B5">INDEPENDENT GAMES, TOOLS &amp; ARTIFACTS</text>
    <rect x="3" y="306" width="340" height="3" rx="1.5" fill="#06B6D4" opacity="0.85"/>
