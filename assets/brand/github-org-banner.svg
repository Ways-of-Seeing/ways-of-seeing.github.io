<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <linearGradient id="bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1119"/><stop offset="55%" stop-color="#090C12"/><stop offset="100%" stop-color="#0A0F18"/>
    </linearGradient>
    <radialGradient id="bGlow" cx="26%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#0AA5C4" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bTop" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#5CE1F5"/><stop offset="100%" stop-color="#0AA5C4"/>
    </linearGradient>
    <linearGradient id="bLeft" x1="0%" y1="0%" x2="60%" y2="100%">
