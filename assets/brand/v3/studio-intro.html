<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ways of Seeing — Studio Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ink: #060914;
      --ultraviolet: #6957FF;
      --phosphor: #D8FF47;
      --lunar: #EDEAE2;
      --muted: #8E8A9F;
      --border-hud: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-ink);
      color: var(--lunar);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ambient Cosmic Vignette */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 48%, rgba(26, 20, 60, 0.65) 0%, rgba(10, 13, 28, 0.95) 55%, #060914 85%);
    }

    /* Framing Marks */
    .hud-frame {
      position: absolute;
      inset: 32px;
      pointer-events: none;
      opacity: 0;
      animation: frameIn 1.2s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--border-hud);
      border-style: solid;
    }
    .c-tl { top: 0; left: 0; border-width: 1.5px 0 0 1.5px; }
    .c-tr { top: 0; right: 0; border-width: 1.5px 1.5px 0 0; }
    .c-bl { bottom: 0; left: 0; border-width: 0 0 1.5px 1.5px; }
    .c-br { bottom: 0; right: 0; border-width: 0 1.5px 1.5px 0; }

    /* Logo Mark Wrap */
    .mark-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(56vw, 440px);
      aspect-ratio: 1 / 1;
    }

    /* Ambient Ethereal Glow */
    .mark-glow {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(105, 87, 255, 0.32) 0%, rgba(216, 255, 71, 0.12) 45%, transparent 70%);
      filter: blur(36px);
      opacity: 0;
      transform: scale(0.85);
      animation: glowBloom 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    /* Pure Vector SVG Logo - No raster lag, no white background flash */
    .master-mark-svg {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transform: scale(0.88);
      filter: drop-shadow(0 0 24px rgba(105, 87, 255, 0.35)) drop-shadow(0 0 48px rgba(216, 255, 71, 0.15));
      animation: arrive 2.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Studio Typographic Lockup */
    .caption {
      margin-top: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: clamp(22px, 3.2vw, 36px);
      font-weight: 800;
      letter-spacing: 0.32em;
      color: #EDEAE2;
      opacity: 0;
      transform: translateY(10px);
      animation: captionIn 1.0s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      font-family: 'Space Mono', monospace;
      font-size: clamp(10px, 1.1vw, 12px);
      font-weight: 500;
      letter-spacing: 0.24em;
      color: var(--muted);
      opacity: 0;
      transform: translateY(6px);
      animation: captionIn 0.9s 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Controls */
    .controls {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-ctl {
      background: rgba(17, 21, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: var(--lunar);
      padding: 7px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .btn-ctl:hover {
      background: rgba(105, 87, 255, 0.35);
      border-color: var(--phosphor);
      color: var(--phosphor);
    }

    /* Keyframes */
    @keyframes arrive {
      0% {
        opacity: 0;
        transform: scale(0.84);
        filter: blur(10px) brightness(0.7);
      }
      60% {
        opacity: 1;
        filter: blur(0px) brightness(1.08);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px) brightness(1.0);
      }
    }

    @keyframes glowBloom {
      0% {
        opacity: 0;
        transform: scale(0.75);
      }
      60% {
        opacity: 0.9;
        transform: scale(1.05);
      }
      100% {
        opacity: 0.75;
        transform: scale(1);
      }
    }

    @keyframes captionIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes frameIn {
      to {
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="hud-frame">
      <span class="corner c-tl"></span>
      <span class="corner c-tr"></span>
      <span class="corner c-bl"></span>
      <span class="corner c-br"></span>
    </div>

    <div class="controls">
      <button id="soundToggle" class="btn-ctl" aria-label="Alternar som">SOM: DESLIGADO</button>
      <button id="replayBtn" class="btn-ctl" aria-label="Repetir abertura">REPLAY ↺</button>
    </div>

    <div class="mark-wrap">
      <div class="mark-glow"></div>
      <svg class="master-mark-svg" viewBox="0 0 1024 1024" role="img" aria-label="Ways of Seeing">
        <defs>
          <linearGradient id="intro-orbit-grad" x1="16%" y1="55%" x2="86%" y2="45%">
            <stop offset="0%" stop-color="#6957FF"/>
            <stop offset="45%" stop-color="#EDEAE2"/>
            <stop offset="100%" stop-color="#D8FF47"/>
          </linearGradient>
        </defs>
        <path d="M116 512C280 292 744 292 908 512 744 732 280 732 116 512Z" fill="none" stroke="url(#intro-orbit-grad)" stroke-width="36" stroke-linecap="round"/>
        <path d="M504 392C625 366 701 443 680 555 661 657 559 700 476 650" fill="none" stroke="#EDEAE2" stroke-width="28" stroke-linecap="round"/>
        <g stroke="#060914" stroke-width="16" stroke-linejoin="round">
          <path d="M512 430 614 485 512 542 410 485Z" fill="#EDEAE2"/>
          <path d="M410 485 512 542 512 654 410 596Z" fill="#6957FF"/>
          <path d="M512 542 614 485 614 596 512 654Z" fill="#D8FF47"/>
        </g>
      </svg>
    </div>

    <div class="caption">
      <h1 class="title">WAYS OF SEEING</h1>
      <p class="subtitle">INDEPENDENT GAMES · TOOLS · DIGITAL ARTIFACTS</p>
    </div>
  </div>

  <script>
    // Sintese Sonora Calorosa e Harmonica (Inspirada em logos cinematograficos)
    let audioCtx = null;
    let soundEnabled = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playWarmIntroChord() {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;

      // 1. Sub Bass Aveludado (48Hz)
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      const subFilter = audioCtx.createBiquadFilter();

      subFilter.type = 'lowpass';
      subFilter.frequency.setValueAtTime(140, now);

      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(48, now);

      subGain.gain.setValueAtTime(0.001, now);
      subGain.gain.exponentialRampToValueAtTime(0.24, now + 0.12);
      subGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);

      subOsc.connect(subFilter);
      subFilter.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + 2.1);

      // 2. Acorde Suave Analógico (A Major 9th caloroso)
      const frequencies = [220.00, 277.18, 329.63, 415.30, 493.88];
      const masterPadGain = audioCtx.createGain();
      const padFilter = audioCtx.createBiquadFilter();

      padFilter.type = 'lowpass';
      padFilter.frequency.setValueAtTime(450, now);
      padFilter.frequency.exponentialRampToValueAtTime(950, now + 0.6);
      padFilter.frequency.exponentialRampToValueAtTime(250, now + 2.4);

      masterPadGain.gain.setValueAtTime(0.001, now);
      masterPadGain.gain.linearRampToValueAtTime(0.06, now + 0.4);
      masterPadGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);

      padFilter.connect(masterPadGain);
      masterPadGain.connect(audioCtx.destination);

      frequencies.forEach(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.connect(padFilter);
        osc.start(now + 0.05);
        osc.stop(now + 2.5);
      });
    }

    const soundToggle = document.getElementById('soundToggle');
    const replayBtn = document.getElementById('replayBtn');

    soundToggle.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? 'SOM: LIGADO' : 'SOM: DESLIGADO';
      if (soundEnabled) playWarmIntroChord();
    });

    replayBtn.addEventListener('click', () => {
      initAudio();
      if (soundEnabled) playWarmIntroChord();

      const mark = document.querySelector('.mark-wrap');
      const caption = document.querySelector('.caption');

      const newMark = mark.cloneNode(true);
      const newCaption = caption.cloneNode(true);

      mark.parentNode.replaceChild(newMark, mark);
      caption.parentNode.replaceChild(newCaption, caption);
    });
  </script>
</body>
</html>
