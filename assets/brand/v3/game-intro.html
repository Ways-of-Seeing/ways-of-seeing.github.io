<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ways of Seeing — Studio Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ink: #060914;
      --ultraviolet: #6957FF;
      --phosphor: #D8FF47;
      --lunar: #EDEAE2;
      --lunar-text: #F4F2EA;
      --muted: #726E8C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-ink);
      color: var(--lunar-text);
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      user-select: none;
    }

    /* Cosmic Background & Starfield */
    #spaceCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(22, 19, 52, 0.45) 0%, rgba(6, 9, 20, 0.95) 70%, #060914 100%);
      pointer-events: none;
    }

    /* Main Stage */
    .stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mark-container {
      position: relative;
      width: min(76vw, 680px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG Vector Animation Layers */
    .intro-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 12;
    }

    /* Outer Eye Path Laser Draw */
    .eye-path {
      stroke-dasharray: 2100;
      stroke-dashoffset: 2100;
      animation: drawEye 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 0 14px rgba(105, 87, 255, 0.65)) drop-shadow(0 0 28px rgba(216, 255, 71, 0.35));
    }

    /* Inner Aperture Spiral */
    .spiral-path {
      stroke-dasharray: 850;
      stroke-dashoffset: 850;
      transform-origin: 512px 512px;
      animation: drawSpiral 1.4s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 spinSpiral 2.2s 0.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      filter: drop-shadow(0 0 10px rgba(237, 234, 226, 0.5));
    }

    /* Isometric Studio Cube Faces */
    .cube-top {
      opacity: 0;
      transform-origin: 512px 485px;
      transform: translateY(-24px) scale(0.85);
      animation: cubePop 0.8s 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 12px rgba(237, 234, 226, 0.6));
    }

    .cube-left {
      opacity: 0;
      transform-origin: 461px 542px;
      transform: translateX(-24px) scale(0.85);
      animation: cubePop 0.8s 1.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 16px rgba(105, 87, 255, 0.7));
    }

    .cube-right {
      opacity: 0;
      transform-origin: 563px 542px;
      transform: translateX(24px) scale(0.85);
      animation: cubePop 0.8s 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 16px rgba(216, 255, 71, 0.7));
    }

    /* Master Textured Overlay (Smooth Organic Blend) */
    .master-texture {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.96);
      filter: blur(8px);
      z-index: 15;
      pointer-events: none;
      animation: masterReveal 1.2s 2.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      mix-blend-mode: screen;
    }

    /* Lens Flare Cosmic Burst */
    .flare {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(237, 234, 226, 0.95) 0%, rgba(216, 255, 71, 0.45) 25%, rgba(105, 87, 255, 0.25) 50%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      animation: flareBurst 0.9s 1.95s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    /* Studio Typographic Lockup */
    .caption-box {
      margin-top: -30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 25;
    }

    .studio-title {
      font-size: clamp(22px, 3.2vw, 44px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--lunar-text);
      opacity: 0;
      transform: translateY(18px);
      animation: titleReveal 1.2s 2.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-shadow: 0 0 24px rgba(237, 234, 226, 0.35);
    }

    .studio-sub {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 600;
      letter-spacing: 0.38em;
      color: var(--muted);
      opacity: 0;
      transform: translateY(12px);
      animation: subReveal 1.0s 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .sub-bar-left {
      width: 32px;
      height: 2px;
      background: var(--ultraviolet);
      border-radius: 1px;
    }

    .sub-bar-right {
      width: 32px;
      height: 2px;
      background: var(--phosphor);
      border-radius: 1px;
    }

    /* UI Controls Header Bar */
    .controls {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-ctl {
      background: rgba(17, 21, 42, 0.65);
      border: 1px solid rgba(105, 87, 255, 0.35);
      border-radius: 6px;
      color: var(--lunar-text);
      padding: 6px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .btn-ctl:hover {
      background: rgba(105, 87, 255, 0.25);
      border-color: var(--phosphor);
      color: var(--phosphor);
      transform: translateY(-1px);
    }

    /* Keyframes */
    @keyframes drawEye {
      0% {
        stroke-dashoffset: 2100;
        opacity: 0.2;
      }
      40% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes drawSpiral {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes spinSpiral {
      0% {
        transform: rotate(-45deg) scale(0.85);
      }
      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes cubePop {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.7);
      }
      60% {
        opacity: 1;
        transform: translateY(-2px) scale(1.05);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes flareBurst {
      0% {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0;
      }
      40% {
        transform: translate(-50%, -50%) scale(1.6);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -50%) scale(2.4);
        opacity: 0;
      }
    }

    @keyframes masterReveal {
      0% {
        opacity: 0;
        transform: scale(0.96);
        filter: blur(8px);
      }
      100% {
        opacity: 0.92;
        transform: scale(1);
        filter: blur(0);
      }
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        letter-spacing: 0.12em;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        letter-spacing: 0.44em;
        transform: translateY(0);
      }
    }

    @keyframes subReveal {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 0.85;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <canvas id="spaceCanvas"></canvas>
  <div class="vignette"></div>

  <div class="controls">
    <button id="soundToggle" class="btn-ctl" aria-label="Toggle sound">AUDIO: ON</button>
    <button id="replayBtn" class="btn-ctl" aria-label="Replay animation">REPLAY ↺</button>
  </div>

  <main class="stage">
    <div class="mark-container">
      <div class="flare"></div>

      <!-- Vector Light Animation -->
      <svg class="intro-svg" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="orbitGrad" x1="16%" y1="55%" x2="86%" y2="45%">
            <stop offset="0%" stop-color="#6957FF"/>
            <stop offset="48%" stop-color="#EDEAE2"/>
            <stop offset="100%" stop-color="#D8FF47"/>
          </linearGradient>
        </defs>

        <!-- Outer Eye Path -->
        <path class="eye-path" d="M116 512C280 292 744 292 908 512 744 732 280 732 116 512Z" 
              fill="none" stroke="url(#orbitGrad)" stroke-width="38" stroke-linecap="round"/>

        <!-- Optical Aperture Spiral -->
        <path class="spiral-path" d="M504 392C625 366 701 443 680 555 661 657 559 700 476 650" 
              fill="none" stroke="#EDEAE2" stroke-width="30" stroke-linecap="round"/>

        <!-- Isometric Studio Cube -->
        <g stroke="#060914" stroke-width="18" stroke-linejoin="round">
          <!-- Top (Lunar) -->
          <path class="cube-top" d="M512 430 614 485 512 542 410 485Z" fill="#EDEAE2"/>
          <!-- Left (Ultraviolet) -->
          <path class="cube-left" d="M410 485 512 542 512 654 410 596Z" fill="#6957FF"/>
          <!-- Right (Phosphor) -->
          <path class="cube-right" d="M512 542 614 485 614 596 512 654Z" fill="#D8FF47"/>
        </g>
      </svg>

      <!-- Master Textured Artwork -->
      <img class="master-texture" src="master-orbital-mark.png" alt="Ways of Seeing Orbital Mark">
    </div>

    <div class="caption-box">
      <h1 class="studio-title">WAYS OF SEEING</h1>
      <div class="studio-sub">
        <span class="sub-bar-left"></span>
        <span>INDEPENDENT GAMES · TOOLS · DIGITAL ARTIFACTS</span>
        <span class="sub-bar-right"></span>
      </div>
    </div>
  </main>

  <script>
    // Starfield Particle Simulation
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 90;

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    function initStars() {
      stars = [];
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          radius: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 0.25 + 0.05,
          color: Math.random() > 0.6 ? '#6957FF' : (Math.random() > 0.4 ? '#D8FF47' : '#EDEAE2'),
          pulse: Math.random() * Math.PI * 2
        });
      }
    }

    function drawStars() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      for (let star of stars) {
        star.pulse += 0.03;
        const currentAlpha = star.alpha * (0.7 + 0.3 * Math.sin(star.pulse));
        ctx.fillStyle = star.color;
        ctx.globalAlpha = currentAlpha;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();

        star.y -= star.speed;
        if (star.y < 0) {
          star.y = h;
          star.x = Math.random() * w;
        }
      }
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    resizeCanvas();
    initStars();
    drawStars();

    // Procedural Web Audio Synthesis
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playStudioSound() {
      if (!soundEnabled || !audioCtx) return;
      const now = audioCtx.currentTime;

      // 1. Sub-bass Drone
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(55, now);
      subOsc.frequency.exponentialRampToValueAtTime(110, now + 1.8);
      subOsc.frequency.exponentialRampToValueAtTime(73.42, now + 3.2);

      subGain.gain.setValueAtTime(0.001, now);
      subGain.gain.linearRampToValueAtTime(0.22, now + 1.2);
      subGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + 3.8);

      // 2. Crystal Chime Chord at Convergence (t = 1.9s)
      const frequencies = [440, 554.37, 659.25, 880]; // A Major Crystal
      frequencies.forEach((freq, idx) => {
        const chimeOsc = audioCtx.createOscillator();
        const chimeGain = audioCtx.createGain();
        chimeOsc.type = 'triangle';
        chimeOsc.frequency.setValueAtTime(freq, now + 1.95 + idx * 0.04);

        chimeGain.gain.setValueAtTime(0.001, now + 1.95);
        chimeGain.gain.linearRampToValueAtTime(0.08 / (idx + 1), now + 2.05);
        chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.6);

        chimeOsc.connect(chimeGain);
        chimeGain.connect(audioCtx.destination);
        chimeOsc.start(now + 1.95);
        chimeOsc.stop(now + 3.6);
      });
    }

    // Controls
    const soundToggle = document.getElementById('soundToggle');
    const replayBtn = document.getElementById('replayBtn');

    soundToggle.addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? 'AUDIO: ON' : 'AUDIO: OFF';
    });

    replayBtn.addEventListener('click', () => {
      initAudio();
      if (soundEnabled) playStudioSound();

      // Reset and trigger CSS animations
      const mark = document.querySelector('.mark-container');
      const caption = document.querySelector('.caption-box');
      
      const newMark = mark.cloneNode(true);
      const newCaption = caption.cloneNode(true);

      mark.parentNode.replaceChild(newMark, mark);
      caption.parentNode.replaceChild(newCaption, caption);
    });

    // Auto-trigger sound on first user gesture
    window.addEventListener('pointerdown', () => {
      if (!audioCtx) {
        initAudio();
        playStudioSound();
      }
    }, { once: true });
  </script>
</body>
</html>
