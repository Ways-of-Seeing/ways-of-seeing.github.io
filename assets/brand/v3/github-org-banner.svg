<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <defs>
    <linearGradient id="v3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="45%" stop-color="#0e0c24"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>
    <radialGradient id="v3Glow" cx="24%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#6957FF" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#D8FF47" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v3Orbit" x1="16%" y1="55%" x2="86%" y2="45%">
      <stop offset="0%" stop-color="#6957FF"/>
      <stop offset="48%" stop-color="#EDEAE2"/>
      <stop offset="100%" stop-color="#D8FF47"/>
    </linearGradient>
    <pattern id="v3Grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#252A4A" stroke-width="0.75" opacity="0.45"/>
    </pattern>
    <filter id="v3Bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="480" fill="url(#v3Bg)"/>
  <rect width="1280" height="480" fill="url(#v3Grid)"/>
  <rect width="1280" height="480" fill="url(#v3Glow)"/>

  <!-- Orbital Mark (v3) - Perfectly Centered Vertically -->
  <g transform="translate(100, 66) scale(0.34)">
    <!-- Eye Contour Orbit with Bloom -->
    <path d="M116 512C280 292 744 292 908 512 744 732 280 732 116 512Z" 
          fill="none" stroke="url(#v3Orbit)" stroke-width="38" stroke-linecap="round" filter="url(#v3Bloom)"/>
    
    <!-- Optical Aperture Spiral -->
    <path d="M504 392C625 366 701 443 680 555 661 657 559 700 476 650" 
          fill="none" stroke="#EDEAE2" stroke-width="30" stroke-linecap="round"/>
    
    <!-- Central Isometric Studio Cube -->
    <g stroke="#060914" stroke-width="18" stroke-linejoin="round">
      <!-- Top / Lunar (Labs, Architecture) -->
      <path d="M512 430 614 485 512 542 410 485Z" fill="#EDEAE2"/>
      <!-- Left / Ultraviolet (Tools, Core) -->
      <path d="M410 485 512 542 512 654 410 596Z" fill="#6957FF"/>
      <!-- Right / Phosphor (Games, Interaction) -->
      <path d="M512 542 614 485 614 596 512 654Z" fill="#D8FF47"/>
    </g>
  </g>

  <!-- Typography & Studio Identifiers -->
  <g transform="translate(500, 0)" font-family="'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif">
    <text x="0" y="195" font-size="72" font-weight="800" letter-spacing="-2.2" fill="#EDEAE2">Ways of Seeing</text>
    <text x="3" y="244" font-size="16.5" font-weight="700" letter-spacing="5.5" fill="#ADA9BC">INDEPENDENT GAMES, TOOLS &amp; ARTIFACTS</text>
    
    <!-- Dual Energy Accent Track -->
    <rect x="3" y="272" width="320" height="3.5" rx="1.75" fill="#6957FF"/>
    <rect x="323" y="272" width="130" height="3.5" rx="1.75" fill="#D8FF47"/>
    
    <!-- Tech Monospace Link & Status -->
    <text x="3" y="322" font-size="18" font-weight="600" letter-spacing="0.5" fill="#D8FF47"
          font-family="'JetBrains Mono',monospace">ways-of-seeing.github.io</text>
    <text x="325" y="322" font-size="14" font-weight="500" letter-spacing="0.8" fill="#726E8C"
          font-family="'JetBrains Mono',monospace">// ESTUDIO AUTORAL</text>
  </g>

  <!-- Studio Corner Crop Marks -->
  <g stroke="#3A4070" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 44 80 L 44 44 L 80 44"/>
    <path d="M 1200 44 L 1236 44 L 1236 80"/>
    <path d="M 1236 400 L 1236 436 L 1200 436"/>
    <path d="M 80 436 L 44 436 L 44 400"/>
  </g>
</svg>
